# Risk-weighted hazard objective: reduce feature.RiskWeightedHazard under the same $100M.
#
# Baseline measured 2026-10-26 on compiled_sf_risk with an empty schedule:
#   feature.RiskWeightedHazard at offset 4 = 9,406,251
# The target is a 0.64% reduction, matching the feasible plain-hazard target in
# config/hazard_objective.yaml so the two runs are comparable.
targets:
  - account: feature.RiskWeightedHazard
    year: 4
    period_width: 1
    maximum: 9346000.0
    max_weight: 1.0
  - account: product.FuelTreatmentCost
    year: 4
    period_width: 5
    maximum: 50000000.0
    max_weight: 10.0
  - account: product.FuelBreakCost
    year: 4
    period_width: 5
    maximum: 25000000.0
    max_weight: 10.0
  - account: product.SurfaceFuelCost
    year: 4
    period_width: 5
    maximum: 25000000.0
    max_weight: 10.0
