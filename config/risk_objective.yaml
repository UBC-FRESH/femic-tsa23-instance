    year: 4
    period_width: 5
    maximum: 50000000.0
    max_weight: 10.0
  - account: product.FuelBreakCost
    year: 4
    period_width: 5
    maximum: 25000000.0
    max_weight: 10.0
  - account: product.SurfaceFuelCost
    year: 4
    period_width: 5
    maximum: 25000000.0
    max_weight: 10.0
