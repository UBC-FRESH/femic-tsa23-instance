schema_version: 1
tsa_code: '23'
metadata:
  source_tsr:
  - title: 100 Mile House TSA TSR Data Package
    year: 2012
    url: http://www.for.gov.bc.ca/ftp/HTS/external/!publish/Timber_Supply_Review/TSA/100_Mile_House_23/TSR_2012/Data_Package/23tsdp12.pdf
    notes: Table 21 regeneration assumptions by analysis unit; Table 22 genetic worth (Fdi/Sx/Pli); OAF
      Section 6.2.3.
  author: agent-provisional
  notes: Per-(leading-species, SI-level) rules from TSR 2012 Tables 21-22. FEMIC SI L/M/H map to TSR poor/medium/good.
    The treated lane strips broadleaf (FEMIC _finalize_species_mix) and reallocates to the top conifer;
    GW_x are pre-aligned to the post-finalize species order.
species_code_overrides:
  SX: SW
defaults:
  e:
    Regen_Method: N
    Proportion: 0.3
    OAF2: 0.95
    FIZ: I
    SI_c1: 1.0
    SI_c2: 0.0
  f:
    Regen_Method: P
    Proportion: 0.7
    OAF2: 0.95
    FIZ: I
    SI_c1: 1.0
    SI_c2: 2.0
