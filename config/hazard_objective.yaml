# Hazard-objective study: reduce landscape hazard under a $100M treatment budget.
#
# Baseline measured 2026-10-21 on compiled_sf with an empty schedule:
#   year 0 1,015,743 | year 4 992,334
# The target is the best feasible reduction under the current $100M split: 986,000
# (0.64% below the 992,334 baseline). The earlier 970,000 target needed $83.8M of
# standalone surface fuel, while SF is operable only after FT in this instance; the
# 986,000 target is reached by the seeded schedule without changing the split.
#
# The three treatment costs have separate ceilings because WS4 has no combined cost
# account; together they bound the budget at $100M (FT $50M + FB $25M + SF $25M).
targets:
  - account: feature.FuelHazard
    year: 4
    period_width: 1
    maximum: 986000.0
    max_weight: 1.0
  - account: product.FuelTreatmentCost
    year: 4
    period_width: 5
    maximum: 50000000.0
    max_weight: 10.0
  - account: product.FuelBreakCost
    year: 4
    period_width: 5
    maximum: 25000000.0
    max_weight: 10.0
  - account: product.SurfaceFuelCost
    year: 4
    period_width: 5
    maximum: 25000000.0
    max_weight: 10.0
